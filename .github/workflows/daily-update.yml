name: Philippines update

on:
  schedule:
    - cron: "0 23 * * *"          # 7:00 AM Manila, every day
    - cron: "0 2,4,6,8 * * 1-5"   # 10 AM, 12 PM, 2 PM, 4 PM Manila, weekdays (market hours and close)
  workflow_dispatch:              # allows a manual run from the Actions tab

concurrency:
  group: ph-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data/ph-weekly.json
        run: python scripts/update_ph.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Philippines update"
          git push
