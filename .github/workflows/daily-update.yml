name: Daily Philippines update

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 7:00 AM in Manila
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data/ph-weekly.json
        run: python scripts/update_ph.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Daily Philippines update"
          git push
